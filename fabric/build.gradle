plugins {
    id "net.fabricmc.fabric-loom"
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.ext.fabricMinecraftVersion}"
    implementation "net.fabricmc:fabric-loader:${rootProject.ext.fabricLoaderVersion}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.ext.fabricApiVersion}"

    implementation project(":common")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(rootProject.ext.javaRuntimeVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = rootProject.ext.javaTargetVersion
}

tasks.processResources {
    inputs.property("version", rootProject.ext.displayVersion)
    inputs.property("minecraftVersion", rootProject.ext.fabricMinecraftVersion)
    inputs.property("loaderVersion", rootProject.ext.fabricLoaderVersion)
    inputs.property("fabricApiVersion", rootProject.ext.fabricApiVersion)
    inputs.property("javaVersion", rootProject.ext.javaRuntimeVersion)
    filesMatching("fabric.mod.json") {
        expand("version": rootProject.ext.displayVersion,
            "minecraftVersion": rootProject.ext.fabricMinecraftVersion,
            "loaderVersion": rootProject.ext.fabricLoaderVersion,
            "fabricApiVersion": rootProject.ext.fabricApiVersion,
            "javaVersion": rootProject.ext.javaRuntimeVersion)
    }
}

loom {
    runs {
        client {
            client()
            runDir = rootProject.file("${rootProject.ext.devRunRoot}/fabric-client").absolutePath
            vmArg("-Dfabric.log.level=info")
        }

        server {
            server()
            runDir = rootProject.file("${rootProject.ext.devRunRoot}/fabric-server").absolutePath
            vmArg("-Dfabric.log.level=info")
            programArg("--nogui")
        }
    }
}

tasks.matching { it.name in ["runClient", "runServer"] }.configureEach {
    jvmArgs("-Xms2G", "-Xmx4G", "-XX:+UseG1GC", "-XX:MaxGCPauseMillis=100")
}

tasks.matching { it.name == "runServer" }.configureEach {
    standardInput = System.in
}

jar {
    archiveBaseName = "TeamLifeBind"
    archiveClassifier = "fabric"
    from(project(":common").sourceSets.main.output)
}

apply from: rootProject.file("gradle/aui.gradle")
