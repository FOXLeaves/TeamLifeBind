plugins {
    id "net.minecraftforge.gradle"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(rootProject.ext.javaRuntimeVersion)
    }
}

minecraft {
    runs {
        register("client") {
            workingDir = rootProject.layout.projectDirectory.dir("${rootProject.ext.devRunRoot}/forge-client")
            systemProperty "eventbus.api.strictRuntimeChecks", "true"
            args "--mixin", "teamlifebind.mixins.json", "--mixin", "tlb-ui.mixins.json"
        }

        register("server") {
            workingDir = rootProject.layout.projectDirectory.dir("${rootProject.ext.devRunRoot}/forge-server")
            systemProperty "eventbus.api.strictRuntimeChecks", "true"
            args "--mixin", "teamlifebind.mixins.json"
            args "--nogui"
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

tasks.matching { it.name in ["runClient", "runServer"] }.configureEach {
    jvmArgs("-Xms2G", "-Xmx4G", "-XX:+UseG1GC", "-XX:MaxGCPauseMillis=100")
    // Forge's DNS factory requires this export when its Java 26 module layer uses reflective fallback.
    jvmArgs("--add-exports=jdk.naming.dns/com.sun.jndi.dns=java.naming")
}

tasks.matching { it.name == "runServer" }.configureEach {
    standardInput = System.in
}

def combinedMainOutputDir = layout.buildDirectory.dir("classes/java/main")

sourceSets {
    main {
        output.resourcesDir = combinedMainOutputDir.get().asFile
    }
}

def cleanRunModResourceClasses = tasks.register("cleanRunModResourceClasses", Delete) {
    delete(layout.buildDirectory.dir("resources/main"))
}

tasks.matching { it.name in ["runClient", "runServer"] }.configureEach {
    dependsOn cleanRunModResourceClasses, tasks.processResources
}

gradle.projectsEvaluated {
    ["prepareRunClientCompile", "prepareRunServerCompile"].each { taskName ->
        def prepTask = tasks.findByName(taskName)
        if (prepTask != null) {
            cleanRunModResourceClasses.configure {
                mustRunAfter prepTask
            }
        }
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${rootProject.ext.forgeVersion}")
    annotationProcessor "net.minecraftforge:eventbus-validator:${rootProject.property('forge_eventbus_validator_version')}"
    implementation project(":common")
}

tasks.compileJava {
    destinationDirectory.set(combinedMainOutputDir)
}

tasks.processResources {
    destinationDir = combinedMainOutputDir.get().asFile
    inputs.property("version", rootProject.ext.displayVersion)
    inputs.property("minecraftVersion", rootProject.ext.modMinecraftVersion)
    inputs.property("forgeVersion", rootProject.ext.forgeVersion.split('-')[1])
    inputs.property("javaVersion", rootProject.ext.javaRuntimeVersion)
    filesMatching("META-INF/mods.toml") {
        expand("version": rootProject.ext.displayVersion,
            "minecraftVersion": rootProject.ext.modMinecraftVersion,
            "forgeVersion": rootProject.ext.forgeVersion.split('-')[1],
            "javaVersion": rootProject.ext.javaRuntimeVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = rootProject.ext.javaTargetVersion
}

jar {
    manifest.attributes("MixinConfigs": "teamlifebind.mixins.json,tlb-ui.mixins.json")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveBaseName = "TeamLifeBind"
    archiveClassifier = "forge"
    from(project(":common").sourceSets.main.output)
}

apply from: rootProject.file("gradle/aui.gradle")
