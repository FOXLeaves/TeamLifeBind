# 0.7 Reconnaissance, respawn credits, control point and finale
item.silent_sigil.name=Silent Sigil
item.silent_sigil.lore=Right-click to consume one and hide your team from trackers and scouts for 20 seconds; 90-second team cooldown. Scout launch positions remain visible.
item.scout_rocket.name=Scout Rocket
item.scout_rocket.lore=Right-click to consume one and reveal enemy-team directions within 48 blocks in this dimension for 5 seconds; exposes your launch position to nearby enemies; 45-second team cooldown.
campaign.mode.dragon_hunt=Dragon hunt
campaign.mode.limited_lives=Limited respawn team match
campaign.dragon.last_hit=Last hit
campaign.dragon.contribution=Damage contribution over 60 seconds
rules.campaign=Mode: {0}; team respawn credits: {1}; dragon victory: {2}; control point: {3}; shrinking border: {4}.
match.rules.summary.campaign=[TLB] Mode: {0}; dragon victory: {1}; pace: {2}; totems: {3}; shared health: {4}; permanent respawn locks: {5}.
command.help.campaign=/tlb campaign opens the match-rules menu.
command.help.campaign_options=/tlb mode <sur|pve|rg|pvp|DRAGON_HUNT|LIMITED_LIVES|RANDOM_GRIMOIRE>; pve <easy|normal|hard>; rg [1|2|3] choose a route; dragon <LAST_HIT|CONTRIBUTION>, objectives on|off, border on|off
rules.reconnect=Disconnecting within 10 seconds of damage or an attack starts a 30-second grace period; expiry triggers one team wipe. In limited mode, a team offline for 30 seconds forfeits. Returning in time avoids that penalty, but does not undo a wipe or elimination.
rules.recon=A Silent Sigil hides your team for 20 seconds with a 90-second team cooldown. A Scout Rocket detects enemies within 48 blocks in the same dimension for 5 seconds and exposes its launch position, with a 45-second team cooldown.
rules.point=The control point extends 6 blocks horizontally and 4 blocks vertically. Accumulate 45 seconds of sole occupation for a reward; contested or empty occupation pauses progress, and a different team resets it. Each team can earn one reward per 5-minute period.
rules.border=When enabled, the border is announced at minute 24 and shrinks from a 750-block radius to 250 blocks during minutes 25-35. Nether coordinates are scaled.
rules.win.limited=Victory: be the last team eligible to participate. All teams eliminated in the same batch produce a draw.
rules.win.contribution=When the Ender Dragon dies, the eligible team with the most actual dragon damage during the preceding 60 seconds wins. Ties prefer the last-hit team, then the lowest team number; no recorded damage falls back to the last hit.
rules.death.limited=Death: each team has {0} respawn credits. The respawn spending the final credit is allowed; the next ordinary wipe eliminates the team. Permanent respawn locks eliminate immediately.
