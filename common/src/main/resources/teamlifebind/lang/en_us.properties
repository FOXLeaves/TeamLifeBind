book.recipes.page4=Reconnaissance and counters\n\nSilent Sigil (shapeless)\nAmethyst Shard x1 + Echo Shard x1\nMakes 1. Hides your team for 20 seconds; consumes 1 on success; 90-second team cooldown.\n\nScout Rocket (shapeless)\nFirework Rocket x1 + Redstone Dust x1\nMakes 1. Scouts enemy teams within 48 blocks in this dimension for 5 seconds and exposes its launch position; consumes 1 on success; 45-second team cooldown.
book.recipes.page3=Team Utility Recipes\n\nResonance Whistle (shapeless)\n2 Copper Ingots + 1 Redstone Dust\nMakes 1. Right-click for a 12s team mark. 15s team cooldown; not consumed.\n\nEmergency Bandage (shapeless)\n2 Paper + 2 String\nMakes 1. Bandage for 4s to heal 2 HP. Consumes 1 on success. 30s team cooldown. Damage, attacking, changing items or dimensions interrupts it.
