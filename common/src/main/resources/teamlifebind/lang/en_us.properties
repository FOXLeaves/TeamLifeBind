rules.magic=Natural chests may contain spellbooks; airdrops guarantee one. Higher tiers are rarer. Learn up to three by sneak-use, then cast without holding a grimoire. Random Grimoire mode grants a tier-one starter book.
book.magic.page1=Magic\n\nFind spellbooks in natural chests; airdrops contain higher tiers.\n\nSneak-use to learn up to three. No held grimoire is required. Swap-hands cycles; sneak + swap-hands casts. /tlb magic cast also works.\n\nPotions restore mana; apples increase the cap for this round only.
book.magic.page1.mod=Magic\n\nSneak-use spellbooks to learn up to three. No held grimoire is required. V casts, hold G to choose, Left Alt + scroll cycles; all keys can be rebound.\n\nMana and three cooldowns stay on the HUD. F8 or the pause menu opens the HUD editor.
