rules.reconnect=受伤或攻击后的 10 秒内断线触发 30 秒宽限；超时触发一次团队团灭。限命赛整队离线超过 30 秒视为弃赛。宽限内回归免罚，但不能绕过团队死亡或永久淘汰。
rules.recon=静默符让整队避开定位 20 秒，团队冷却 90 秒。侦察火箭探测同维度 48 格敌人 5 秒并暴露发射位置，团队冷却 45 秒。
rules.point=契约据点范围为水平 6 格、高度 ±4 格。独占累计 45 秒获奖；争夺或无人时暂停，换队归零。每 5 分钟周期每队最多获奖一次。
rules.border=开启收圈后，第 24 分钟预告；第 25–35 分钟将半径从 750 格缩至 250 格。下界按坐标比例缩放。
rules.win.limited=胜负目标: 成为最后一支仍有参赛资格的队伍；同批次全部淘汰为平局。
rules.win.contribution=末影龙死亡时，近 60 秒对该龙实际伤害最高的合资格队伍获胜；同分优先最后一击队伍，再按队伍编号从小到大。没有伤害记录时按最后一击结算。
rules.death.limited=死亡规则: 每队有 {0} 次重生额度；消耗最后一次额度的当次仍可复活，下一次普通团灭才淘汰。永久禁复活立即淘汰。
