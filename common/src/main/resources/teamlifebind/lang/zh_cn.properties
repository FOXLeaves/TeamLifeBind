book.recipes.page4=侦察与反制道具\n\n静默符（无序合成）\n紫水晶碎片 ×1 + 回响碎片 ×1\n产出 1 个；整队静默 20 秒，成功耗 1 个，团队冷却 90 秒。\n\n侦察火箭（无序合成）\n烟花火箭 ×1 + 红石粉 ×1\n产出 1 个；探测同维度 48 格敌队 5 秒并暴露发射位置，成功耗 1 个，团队冷却 45 秒。
book.recipes.page3=团队协作道具\n\n共鸣哨（无序合成）\n铜锭 ×2 + 红石粉 ×1\n产出 1 个；右键标记 12 秒，团队冷却 15 秒，不消耗。\n\n应急绷带（无序合成）\n纸 ×2 + 线 ×2\n产出 1 个；包扎 4 秒恢复 2 HP，成功耗 1 个，团队冷却 30 秒。受伤、攻击、换物、换维度会打断。
