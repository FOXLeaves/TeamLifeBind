book.weapons.page1=空投枪械\n\n争夺成功的空投内随机出现 1 把枪，无法合成。\n\n右键射击；自动枪按住连射；默认 {0} 键换弹；蹲下提高精度。\n\n备弹无限，但弹匣打空仍需换弹。换枪、离场和死亡会取消换弹。\n\n火箭爆炸不毁方块；友军挡住弹道但不受伤。
