rules.magic=自然生成箱子可获得魔法书，空投保证一本；位阶越高越稀有。潜行右键学习，最多三种，学习后无需手持魔典即可施法。随机魔典模式开局赠送一本一阶书。
book.magic.page1=魔法入门\n\n在自然箱子中寻找魔法书，空投含更高阶魔法。\n\n潜行右键学习，最多三种。学习后无需手持魔典；F 切换，潜行＋F 施法，也可使用 /tlb magic cast。\n\n药水恢复魔力，苹果提高本局上限，遗忘之书腾出学习槽。
book.magic.page1.mod=魔法入门\n\n在自然箱子中寻找魔法书，空投含更高阶魔法。\n\n潜行右键学习，最多三种。学习后默认 V 施法、按住 G 选择、左 Alt＋滚轮切换，无需手持魔典；键位可改。\n\n左下角常驻显示魔力与三槽冷却；F8 或暂停菜单可编辑 HUD。
