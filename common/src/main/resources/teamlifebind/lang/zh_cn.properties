item.tactical_smg.native_lore=空投专属紧凑冲锋枪，低轴枪管。\n按住左键连射，按住右键瞄准；默认 {0} 键换弹。\n弹匣 20 发；备弹无限，无合成方式。
item.assault_rifle.native_name=SCAR-H 步枪
item.assault_rifle.native_lore=空投专属重型突击步枪，折叠伸缩枪托。\n按住左键连射，按住右键瞄准；默认 {0} 键换弹。\n弹匣 20 发；备弹无限，无合成方式。
item.breach_shotgun.native_name=SPAS-12 霰弹枪
item.breach_shotgun.native_lore=空投专属霰弹枪，泵动护木和顶部折叠架。\n左键射击，按住右键瞄准；默认 {0} 键换弹。\n弹仓 5 发，逐发装填；备弹无限，无合成方式。
item.marksman_rifle.native_name=M95 狙击枪
item.marksman_rifle.native_lore=空投专属无托栓动步枪，后置弹匣与铁瞄。\n左键射击，按住右键瞄准；默认 {0} 键换弹。\n弹匣 5 发；备弹无限，无合成方式。
item.support_machine_gun.native_name=Minigun 旋转机枪
item.support_machine_gun.native_lore=空投专属六管旋转机枪，电机与侧面供弹。\n按住左键起转并连射，按住右键瞄准。\n无限连续供弹，无弹匣换弹动作；停火管理热量。
item.siege_launcher.native_name=RPG7 火箭筒
item.siege_launcher.native_lore=空投专属火箭筒，隔热护套与瞄具。\n左键发射，按住右键瞄准；默认 {0} 键换弹。\n每次装填 1 枚；备弹无限，无合成方式。
gun.controls.mod=左键射击／按住连射，按住右键瞄准；默认 {0} 键换弹，可在控制设置改键。
rules.guns.mod=空投争夺成功后获得独立实现的枪械，无合成方式、无限备弹；左键开火，右键瞄准，默认 {0} 键换弹。Minigun 使用无限连续供弹与热量机制。
book.weapons.page1.mod=空投枪械\n\n每个争夺成功的空投随机出现 1 把枪，无法合成。\n\n左键射击；自动枪按住连射。按住右键瞄准。默认 {0} 键换弹，可在控制设置中的枪械换弹项改键。F 保留原版换手。\n\n备弹无限，弹匣仍需计时换弹；Minigun 使用无限连续供弹与热量控制。\n\n火箭不毁方块；友军挡弹但不受伤。
