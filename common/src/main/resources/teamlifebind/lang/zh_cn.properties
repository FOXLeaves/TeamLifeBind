item.battle_pistol.lore=空投专属重型手炮；短暂蓄力后单发射击。\n右键射击，默认 {0} 键换弹，蹲下瞄准。\n弹匣 5 发；备弹无限，无合成方式。
item.tactical_smg.name=疾风冲锋枪
item.tactical_smg.lore=空投专属高速冲锋枪；适合近距离连续压制。\n按住右键连射，默认 {0} 键换弹，蹲下瞄准。\n弹匣 30 发；备弹无限，无合成方式。
item.assault_rifle.name=裂锋步枪
item.assault_rifle.lore=空投专属突击步枪；中距离火力与精度兼顾。\n按住右键连射，默认 {0} 键换弹，蹲下瞄准。\n弹匣 20 发；备弹无限，无合成方式。
item.breach_shotgun.name=破阵霰弹枪
item.breach_shotgun.lore=空投专属近战霰弹枪；一发散出 8 颗弹丸。\n右键射击，默认 {0} 键换弹，蹲下收紧散布。\n弹匣 8 发；备弹无限，无合成方式。
item.marksman_rifle.name=远星狙击枪
item.marksman_rifle.lore=空投专属远程狙击枪；高精度单发，射击间隔较长。\n右键射击，默认 {0} 键换弹，蹲下瞄准。\n弹匣 5 发；备弹无限，无合成方式。
item.support_machine_gun.name=风暴旋转机枪
item.support_machine_gun.lore=空投专属旋转机枪；起转后持续连射，过热时须冷却。\n按住右键连射，默认 {0} 键换弹，蹲下瞄准。\n弹匣 120 发；备弹无限，无合成方式。
item.siege_launcher.name=重锤火箭筒
