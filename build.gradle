plugins {
    id "base"
}

allprojects {
    group = "com.teamlifebind"
    version = rootProject.property("mod_version")

    ext {
        displayVersion = rootProject.property("display_version")
        javaRuntimeVersion = rootProject.property("java_runtime_version").toInteger()
        javaTargetVersion = rootProject.property("java_target_version").toInteger()
        commonJavaTargetVersion = rootProject.property("common_java_target_version").toInteger()
        modMinecraftVersion = rootProject.property("minecraft_version")
        fabricMinecraftVersion = modMinecraftVersion
        serverMinecraftVersion = modMinecraftVersion
        serverApiVersion = rootProject.property("server_api_version")
        fabricLoaderVersion = rootProject.property("fabric_loader_version")
        fabricApiVersion = rootProject.property("fabric_api_version")
        forgeVersion = rootProject.property("forge_version")
        neoForgeVersion = rootProject.property("neoforge_version")
        devRunRoot = rootProject.findProperty("dev_run_root") ?: "run"
    }

    repositories {
        mavenCentral()
        maven {
            url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
            content {
                includeGroup "org.spigotmc"
            }
        }
        maven {
            url = "https://maven.fabricmc.net/"
        }
        maven {
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            url = "https://maven.neoforged.net/releases"
        }
    }
}

subprojects {
    apply plugin: "java"

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(rootProject.ext.javaRuntimeVersion)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = rootProject.ext.javaTargetVersion
    }

    tasks.withType(JavaExec).configureEach {
        javaLauncher = javaToolchains.launcherFor(java.toolchain)
    }
}

tasks.register("runServer") {
    group = "teamlifebind"
    description = "Run local shared Bukkit/Spigot/Paper test server with TeamLifeBind plugin."
    dependsOn(":server:runTestServer")
}

tasks.register("runServerConsole") {
    group = "teamlifebind"
    description = "Run local shared server in a dedicated interactive console window."
    dependsOn(":server:runTestServerConsole")
}

tasks.register("runPaperServer") {
    group = "teamlifebind"
    description = "Alias of runServer for backward compatibility."
    dependsOn("runServer")
}

tasks.register("runFabricClient") {
    group = "teamlifebind"
    description = "Run local Fabric test client (quick connect to localhost)."
    dependsOn(":fabric:runClient")
}

tasks.register("runFabricServer") {
    group = "teamlifebind"
    description = "Run local Fabric test server."
    dependsOn(":fabric:runServer")
}

tasks.register("runForgeClient") {
    group = "teamlifebind"
    description = "Run local Forge test client (quick connect to localhost)."
    dependsOn(":forge:runClient")
}

tasks.register("runForgeServer") {
    group = "teamlifebind"
    description = "Run local Forge test server."
    dependsOn(":forge:runServer")
}

tasks.register("runNeoForgeClient") {
    group = "teamlifebind"
    description = "Run local NeoForge test client (quick connect to localhost)."
    dependsOn(":neoforge:runClient")
}

tasks.register("runNeoForgeServer") {
    group = "teamlifebind"
    description = "Run local NeoForge test server."
    dependsOn(":neoforge:runServer")
}

tasks.register("setupServer") {
    group = "teamlifebind"
    description = "Build plugin and prepare local shared Bukkit/Spigot/Paper test server files."
    dependsOn(":server:prepareTestServer", ":server:syncTestPlugin")
}

tasks.register("setupPaperServer") {
    group = "teamlifebind"
    description = "Alias of setupServer for backward compatibility."
    dependsOn("setupServer")
}

if (["server", "fabric", "forge", "neoforge"].every { findProject(":${it}") != null }) {
    tasks.register("bundleRelease", Zip) {
        group = "teamlifebind"
        description = "Build and bundle all four platforms, the server resource pack, and release documentation."
        archiveBaseName = "TeamLifeBind"
        archiveClassifier = "mc${rootProject.ext.modMinecraftVersion}"
        destinationDirectory = layout.buildDirectory.dir("distributions")
        dependsOn(":common:check", ":server:buildServerResourcePack")
        ["server", "fabric", "forge", "neoforge"].each { platform ->
            def module = project(":${platform}")
            dependsOn(":${platform}:build")
            from(module.tasks.named("jar").flatMap { it.archiveFile }) {
                into(platform == "server" ? "plugins" : "mods/${platform}")
            }
        }
        from(project(":server").tasks.named("buildServerResourcePack").flatMap { it.archiveFile }) {
            into("resourcepack")
        }
        from("README.md", "LICENSE", "CHANGELOG.md")
        from("docs") {
            into("docs")
        }
    }
}
