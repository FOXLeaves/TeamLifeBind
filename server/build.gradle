def localServerJar = rootProject.file(providers.gradleProperty("server_jar")
    .getOrElse(".tools/spigot-${rootProject.ext.serverMinecraftVersion}.jar"))

dependencies {
    implementation project(":common")
    compileOnly "org.spigotmc:spigot-api:${rootProject.ext.serverApiVersion}"
}

tasks.processResources {
    inputs.property("version", rootProject.ext.displayVersion)
    inputs.property("minecraftVersion", rootProject.ext.serverMinecraftVersion)
    filesMatching("plugin.yml") {
        expand("version": rootProject.ext.displayVersion, "minecraftVersion": rootProject.ext.serverMinecraftVersion)
    }
}

jar {
    archiveBaseName = "TeamLifeBind"
    archiveClassifier = "server"
    from(project(":common").sourceSets.main.output) {
        // Guns remain available in native mods; the standalone server edition has no gun engine.
        exclude "com/teamlifebind/common/Gun*.class"
        exclude "com/teamlifebind/common/NativeHud*.class"
        filesMatching("teamlifebind/lang/*.properties") {
            filter { String line ->
                def key = line.split("=", 2)[0]
                boolean removed = key.startsWith("gun.") || key.startsWith("rules.guns")
                    || key.startsWith("book.weapons.") || key.startsWith("dev.menu.gun.")
                    || key == "dev.menu.info.guns" || key ==~ /item\.(battle_pistol|tactical_smg|assault_rifle|breach_shotgun|marksman_rifle|support_machine_gun|siege_launcher)\..*/
                removed ? null : line
            }
        }
    }
}

def testServerDir = rootProject.layout.projectDirectory.dir("${rootProject.ext.devRunRoot}/server")
def pluginsDir = testServerDir.dir("plugins")
def testResourcePacksDir = testServerDir.dir("resourcepacks")
def serverJarFile = localServerJar
def testPluginJarFile = pluginsDir.file("TeamLifeBind-server.jar")
def testResourcePackFile = testResourcePacksDir.file("TeamLifeBind-resourcepack.zip")
def consoleScriptFile = testServerDir.file("start-server.cmd")
def serverJvmArgs = [
    "-Xms2G",
    "-Xmx4G",
    "-XX:+UseG1GC",
    "-XX:MaxGCPauseMillis=100",
    "--enable-native-access=ALL-UNNAMED",
    "--sun-misc-unsafe-memory-access=allow"
]

def upsertProperty = { File file, String key, String value ->
    List<String> lines = file.exists() ? file.readLines("UTF-8") : []
    boolean found = false
    List<String> rewritten = lines.collect { line ->
        if (line.startsWith("${key}=")) {
            found = true
            return "${key}=${value}"
        }
        return line
    }
    if (!found) {
        rewritten.add("${key}=${value}")
    }
    file.text = rewritten.join(System.lineSeparator()) + System.lineSeparator()
}

tasks.register("prepareTestServer") {
    group = "teamlifebind"
    description = "Build plugin and prepare shared Bukkit/Spigot/Paper server runtime files."
    inputs.property("serverJarPath", serverJarFile.absolutePath)
    inputs.property("javaRuntimeVersion", rootProject.ext.javaRuntimeVersion)
    outputs.files(consoleScriptFile, testServerDir.file("eula.txt"), testServerDir.file("server.properties"))

    doLast {
        File serverDir = testServerDir.asFile
        File plugins = pluginsDir.asFile
        File resourcePacks = testResourcePacksDir.asFile
        File serverJar = serverJarFile
        serverDir.mkdirs()
        plugins.mkdirs()
        resourcePacks.mkdirs()

        if (!serverJar.exists()) {
            throw new GradleException("Minecraft ${rootProject.ext.serverMinecraftVersion} server jar not found: ${serverJar.absolutePath}. Supply -Pserver_jar=/absolute/path/to/server.jar.")
        }

        File eula = new File(serverDir, "eula.txt")
        eula.text = "eula=true${System.lineSeparator()}"

        File props = new File(serverDir, "server.properties")
        upsertProperty(props, "online-mode", "false")
        upsertProperty(props, "motd", "TeamLifeBind Test Server")
        upsertProperty(props, "spawn-protection", "0")
        upsertProperty(props, "pvp", "true")
        upsertProperty(props, "difficulty", "hard")
        upsertProperty(props, "allow-flight", "true")
        upsertProperty(props, "view-distance", "6")
        upsertProperty(props, "simulation-distance", "4")
        upsertProperty(props, "spawn-chunk-radius", "0")

        def javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(rootProject.ext.javaRuntimeVersion)
        }.get()
        File consoleScript = consoleScriptFile.asFile
        consoleScript.text =
            "@echo off${System.lineSeparator()}" +
            "title TeamLifeBind Server${System.lineSeparator()}" +
            "cd /d \"%~dp0\"${System.lineSeparator()}" +
            "\"${javaLauncher.executablePath.asFile.absolutePath}\" ${serverJvmArgs.join(' ')} -jar \"${serverJar.absolutePath}\" nogui${System.lineSeparator()}" +
            "pause${System.lineSeparator()}"

    }
}

def serverPackAssets = layout.buildDirectory.dir("server-resourcepack-assets")
tasks.register("prepareServerResourcePackAssets", Sync) {
    from(rootProject.file("fabric/src/main/resources/assets")) {
        include "teamlifebind/**"
        exclude "teamlifebind/sounds/gun/**", "teamlifebind/sounds.json", "teamlifebind/textures/item/weapon_atlas.png"
        ["battle_pistol", "tactical_smg", "assault_rifle", "breach_shotgun", "marksman_rifle", "support_machine_gun", "siege_launcher"].each { id ->
            exclude "teamlifebind/items/${id}.json", "teamlifebind/models/item/${id}*.json"
        }
    }
    into(serverPackAssets)
    doLast {
        fileTree(serverPackAssets).matching { include "teamlifebind/lang/*.json" }.each { file ->
            Map entries = new groovy.json.JsonSlurper().parse(file, "UTF-8")
            entries.keySet().removeAll { key ->
                key.toString().startsWith("hud.teamlifebind.") || key.toString().contains(".gun.") || key.toString().startsWith("key.teamlifebind.reload")
                    || key.toString() ==~ /item\.teamlifebind\.(battle_pistol|tactical_smg|assault_rifle|breach_shotgun|marksman_rifle|support_machine_gun|siege_launcher)(\..*)?/
            }
            file.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(entries)) + "\n", "UTF-8")
        }
    }
}

tasks.register("buildServerResourcePack", Zip) {
    group = "teamlifebind"
    description = "Build TeamLifeBind server resource pack with utility and magic assets, excluding native-only guns."
    archiveBaseName = "TeamLifeBind-resourcepack"
    destinationDirectory = rootProject.layout.buildDirectory.dir("resourcepack")

    from(project.file("src/resourcepack/pack.mcmeta"))
    dependsOn(tasks.named("prepareServerResourcePackAssets"))
    from(serverPackAssets) {
        into("assets")
    }
}

tasks.register("syncTestResourcePack", Copy) {
    group = "teamlifebind"
    description = "Copy the generated TeamLifeBind resource pack into run/server/resourcepacks."
    dependsOn(tasks.named("buildServerResourcePack"))
    from(tasks.named("buildServerResourcePack").flatMap { it.archiveFile })
    into(testResourcePacksDir)
    rename { "TeamLifeBind-resourcepack.zip" }
    outputs.file(testResourcePackFile)

    doFirst {
        testResourcePacksDir.asFile.mkdirs()
    }
}

tasks.register("syncTestPlugin", Copy) {
    group = "teamlifebind"
    description = "Copy latest TeamLifeBind server jar into run/server/plugins."
    dependsOn(tasks.named("jar"))
    from(tasks.named("jar").flatMap { it.archiveFile })
    into(pluginsDir)
    rename { "TeamLifeBind-server.jar" }
    inputs.file(tasks.named("jar").flatMap { it.archiveFile })
    outputs.file(testPluginJarFile)

    doFirst {
        pluginsDir.asFile.mkdirs()
    }
}

tasks.register("runTestServer", Exec) {
    group = "teamlifebind"
    description = "Run local shared Bukkit/Spigot/Paper test server (nogui)."
    dependsOn(tasks.named("prepareTestServer"), tasks.named("syncTestPlugin"), tasks.named("syncTestResourcePack"))
    workingDir(testServerDir)
    standardInput = System.in
    standardOutput = System.out
    errorOutput = System.err

    doFirst {
        def javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(rootProject.ext.javaRuntimeVersion)
        }.get()
        commandLine(
            javaLauncher.executablePath.asFile.absolutePath,
            *serverJvmArgs,
            "-jar",
            serverJarFile.absolutePath,
            "nogui"
        )
    }
}

tasks.register("runTestServerConsole", Exec) {
    group = "teamlifebind"
    description = "Run local shared server in a dedicated console window for interactive commands."
    dependsOn(tasks.named("prepareTestServer"), tasks.named("syncTestPlugin"), tasks.named("syncTestResourcePack"))
    workingDir(testServerDir)

    doFirst {
        commandLine(
            "cmd",
            "/c",
            "start",
            "TeamLifeBind Server",
            "cmd",
            "/k",
            consoleScriptFile.asFile.absolutePath
        )
    }
}
