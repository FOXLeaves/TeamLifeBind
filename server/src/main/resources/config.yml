team-count: 2
health-preset: ONE_HEART
gameplay:
  # CLASSIC: portals/supply/stronghold at 15/20/30 min; FAST: 8/10/15 min.
  match-pace: CLASSIC
  # BALANCED: upgraded totem regen 20s, total absorption maxHP*0.5 capped at 8 HP,
  # and 45s shared team cooldown. CLASSIC preserves the original values.
  totem-balance: CLASSIC
  # Optional round rules; lobby commands/menu capture them at round start.
  match-mode: DRAGON_HUNT
  # Three paid respawns; fourth ordinary team wipe eliminates the team.
  team-lives: 3
  dragon-victory: LAST_HIT
  control-point-enabled: false
  border-enabled: false
random-spawn-radius: 750
min-team-distance: 280
team-spread-radius: 16
announce-team-assignment: true
ready-countdown-seconds: 10
lobby-world-directory: tlb_lobby
match-world-prefix: tlb_match
scoreboard:
  enabled: true
  update-interval-ticks: 20
tab:
  enabled: true
chunk-preloading:
  # Bukkit/Spigot: synchronous loads per tick (1-8).
  sync-per-tick: 1
  # Paper: submissions per tick (1-32) and maximum unfinished requests (1-64).
  async-per-tick: 4
  max-in-flight: 8
advancements:
  enabled: false
# Server resource pack support:
# 1. Run :server:buildServerResourcePack or :server:syncTestResourcePack
# 2. Host the generated zip somewhere players can download
# 3. Fill url and optional sha1, then /tlb reload
resource-pack:
  enabled: false
  url: ""
  sha1: ""
health-sync:
  enabled: true
timed-events:
  auto-nether-portals:
    enabled: true
  anonymous-stronghold-hints:
    enabled: true
  supply-drops:
    # When enabled, positive count means enabled; amount follows eligible teams (2-8).
    dynamic-count: true
    count: 5
end-totem-restriction:
  enabled: true
no-respawn:
  enabled: true
  blocked-dimensions:
    - minecraft:the_end

# Team Bed:
# - Recipe: 6 wool (top 2 rows) + 3 planks (bottom row)
# - Team bed placement sets team respawn point
# - Normal beds are disabled and explode on placement

# Example:
# spawns:
#   1:
#     world: world
#     x: 0.5
#     y: 65.0
#     z: 0.5
#     yaw: 0.0
#     pitch: 0.0
spawns: {}
